name: OCI Ampere A1 Auto-Claimer

on:
  schedule:
    # Runs every 10 minutes automatically 24/7/365 in Microsoft/GitHub's US datacenter
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

jobs:
  claim-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OCI Python SDK
        run: |
          pip install --upgrade pip
          pip install oci

      - name: Run Provisioning Loop
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION || 'us-ashburn-1' }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          python launch_instance.py
